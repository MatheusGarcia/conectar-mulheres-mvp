    <text x="24" y="70" class="icon">‹</text><text x="64" y="70" class="h2">Orientação</text><rect x="300" y="44" width="66" height="36" rx="18" class="surface border"/><text x="333" y="67" class="small center">Sair</text>
    <text x="24" y="116" class="small active">SEGURANÇA · 5 MIN</text><text x="24" y="154" class="title">Estou sofrendo violência.</text><text x="24" y="184" class="title">O que posso fazer?</text>
    <text x="24" y="224" class="body">Você não é responsável pela violência.</text><text x="24" y="246" class="body">Procure ajuda no momento mais seguro para você.</text>
    <rect x="24" y="276" width="342" height="100" rx="16" class="dangerbg"/><text x="44" y="308" class="label" style="fill:#C42C1E">Risco imediato?</text><text x="44" y="336" class="body">Ligue 190. Para orientação e denúncia,</text><text x="44" y="358" class="body">o Ligue 180 funciona 24 horas.</text>
    <text x="24" y="420" class="h2">1. Priorize sua segurança</text><text x="24" y="450" class="body">Se possível, vá para um local com saída e evite</text><text x="24" y="472" class="body">ambientes com objetos que possam ferir.</text>
    <text x="24" y="524" class="h2">2. Avise alguém de confiança</text><text x="24" y="554" class="body">Combine uma palavra ou mensagem que indique</text><text x="24" y="576" class="body">que você precisa de ajuda.</text>
    <text x="24" y="628" class="h2">3. Busque atendimento</text><text x="24" y="658" class="body">A rede pode orientar sobre acolhimento, registro</text><text x="24" y="680" class="body">e medidas de proteção.</text>
    <rect x="24" y="724" width="342" height="56" rx="28" class="teal"/><text x="195" y="759" class="label white center">Encontrar rede de apoio</text>
    <text x="24" y="814" class="small">Fonte: serviços oficiais · Revisado em 2026</text>
  </g>

