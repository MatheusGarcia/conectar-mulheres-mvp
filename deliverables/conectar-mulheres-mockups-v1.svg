    <text x="24" y="70" class="icon">‹</text><text x="64" y="70" class="h2">Contato de confiança</text><rect x="300" y="44" width="66" height="36" rx="18" class="surface border"/><text x="333" y="67" class="small center">Sair</text>
    <text x="24" y="118" class="title">Prepare uma mensagem</text><text x="24" y="148" class="body">Nada será enviado sem sua confirmação.</text>
    <text x="24" y="200" class="label">Nome do contato</text><rect x="24" y="214" width="342" height="52" rx="12" class="surface border"/><text x="44" y="246" class="body">Ex.: Ana</text>
    <text x="24" y="306" class="label">Número do WhatsApp</text><rect x="24" y="320" width="342" height="52" rx="12" class="surface border"/><text x="44" y="352" class="body">(83) 9 0000-0000</text>
    <text x="24" y="412" class="label">Mensagem</text><rect x="24" y="426" width="342" height="136" rx="14" class="surface border"/><text x="44" y="458" class="body">Preciso que você entre em contato comigo.</text><text x="44" y="482" class="body">Se eu não responder, procure ajuda.</text><text x="44" y="522" class="small">A mensagem pode ser editada antes do envio.</text>
    <rect x="24" y="586" width="342" height="56" rx="28" class="teal"/><text x="195" y="621" class="label white center">Revisar no WhatsApp</text>
    <rect x="24" y="662" width="342" height="90" rx="16" class="amber"/><text x="44" y="694" class="label">Sobre seus dados</text><text x="44" y="720" class="small">O contato permanece neste dispositivo e não</text><text x="44" y="740" class="small">é enviado para o servidor neste MVP.</text>
    <text x="195" y="802" class="small center">Você controla quando e o que enviar</text>
